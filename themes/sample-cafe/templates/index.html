<section class="hero" data-section="hero" data-label="ヒーロー">
  <h1 data-field="hero.heading" data-label="見出し">こだわりの一杯を、ゆっくりと。</h1>
  <p data-field="hero.lead" data-label="リード文">駅前の小さな自家焙煎珈琲店です。</p>
  <a class="btn" data-field="hero.cta_url" data-label="ボタンのリンク" href="#">
    <span data-field="hero.cta_label" data-label="ボタンの文言">メニューを見る</span>
  </a>
</section>

<section class="news" data-section="news" data-label="お知らせ">
  <h2 data-field="news.title" data-label="見出し">お知らせ</h2>
  <ul class="post-list">
    <li data-loop="posts" data-limit="3">
      <a data-field="post.url" href="#">
        <span class="date" data-field="post.date">2026-01-01</span>
        <span class="title" data-field="post.title">記事タイトル</span>
      </a>
    </li>
  </ul>
</section>

<section class="menu-list" data-section="menu" data-label="メニュー">
  <h2 data-field="menu.title" data-label="見出し">メニュー</h2>
  <div class="items">
    <div class="item" data-repeat="items" data-label="メニュー項目">
      <h3 data-field="name" data-label="商品名">ブレンドコーヒー</h3>
      <p class="price" data-field="price" data-label="価格">480円</p>
      <p class="note" data-field="note" data-label="説明" data-if="note">やさしい口当たり。</p>
    </div>
  </div>
</section>
