# electron-builder configuration.
# The app icon is build/icon.png (1024×1024), picked up automatically via
# buildResources below. The publish feed points at the project's GitHub repo so
# auto-update works. Code signing is driven by env/CI secrets and is skipped
# when none are present, so unsigned local builds still succeed.
appId: com.kumito.app
productName: KUMITO
copyright: Copyright © 2026 KUMITO

directories:
  output: release
  buildResources: build

# electron-vite builds main/preload/renderer into out/.
files:
  - out/**/*
  - package.json

# The default theme lives outside the app in the monorepo; ship it as a resource.
extraResources:
  - from: ../../themes/sample-cafe
    to: themes/sample-cafe

# ssh2's optional native crypto binding must run from disk, not the asar.
asarUnpack:
  - "**/node_modules/ssh2/**"

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  maintainer: KUMITO

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Auto-update feed + release target (GitHub Releases).
publish:
  provider: github
  owner: ichao130
  repo: cms-visiual-editor
